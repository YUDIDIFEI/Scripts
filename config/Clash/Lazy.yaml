# 完整分流配置。导入前只需将下面的订阅占位链接换成你自己的节点订阅。
# 订阅必须输出与本客户端兼容的节点格式；不要把私人订阅提交到公开仓库。
mode: rule
log-level: warning
ipv6: false
mixed-port: 7890
allow-lan: false
external-controller: 127.0.0.1:9090

proxy-providers:
  Nodes:
    type: http
    url: https://subscription.example.invalid/REPLACE_WITH_YOUR_SUBSCRIPTION
    path: ./providers/Nodes.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: AUTO
    type: url-test
    proxies: [REJECT]
    use: [Nodes]
    url: https://www.gstatic.com/generate_204
    interval: 600
  - name: PROXY
    type: select
    proxies: [AUTO, REJECT]
  - name: AI
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: YouTube
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: Netflix
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: DisneyPlus
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: Max
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: PrimeVideo
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: Spotify
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]
  - name: TikTok
    type: select
    proxies: [PROXY, DIRECT]
    use: [Nodes]

