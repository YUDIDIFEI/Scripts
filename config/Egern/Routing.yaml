# Merge these items into your existing policy_groups and rules lists.
# PROXY and 美国手动 must name existing Egern policies; select a US node for PayPal.
policy_groups:
  - select:
      name: 国内分流
      policies: [DIRECT, PROXY]
rules:
  - rule_set:
      name: LAN
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/LAN/LAN.yaml
      policy: DIRECT
      update_interval: 86400
      disabled: false
  - rule_set:
      name: AI
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/AI/AI.yaml
      policy: PROXY
      update_interval: 86400
      disabled: false
  - rule_set:
      name: YouTube
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/YouTube/YouTube.yaml
      policy: PROXY
      update_interval: 86400
      disabled: false
  - rule_set:
      name: Netflix
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/Netflix/Netflix.yaml
      policy: PROXY
      update_interval: 86400
      disabled: false
  - rule_set:
      name: DisneyPlus
