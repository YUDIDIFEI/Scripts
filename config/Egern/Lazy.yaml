rules:
  - domain_suffix:
      match: local
      policy: DIRECT
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 100.64.0.0/10
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 169.254.0.0/16
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT
      no_resolve: true
  - ip_cidr6:
      match: fc00::/7
      policy: DIRECT
      no_resolve: true
  - ip_cidr6:
      match: fe80::/10
      policy: DIRECT
      no_resolve: true
  - rule_set:
