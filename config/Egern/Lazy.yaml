  - rule_set:
      name: Max
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/Max/Max.yaml
      policy: Max
      update_interval: 86400
  - rule_set:
      name: PrimeVideo
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/PrimeVideo/PrimeVideo.yaml
      policy: PrimeVideo
      update_interval: 86400
  - rule_set:
      name: Spotify
      match: https://raw.githubusercontent.com/YUDIDIFEI/Scripts/master/rule/Egern/Spotify/Spotify.yaml
