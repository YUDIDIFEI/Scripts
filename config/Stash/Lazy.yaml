# 完整分流配置。导入前只需将下面的订阅占位链接换成你自己的节点订阅。
# 订阅必须输出与本客户端兼容的节点格式；不要把私人订阅提交到公开仓库。
mode: rule
log-level: warning
ipv6: false
mixed-port: 7890
allow-lan: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    '+.local': system
    '+.lan': system
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-providers:
  Nodes:
    url: https://subscription.example.invalid/REPLACE_WITH_YOUR_SUBSCRIPTION
    path: ./providers/Nodes.yaml
    interval: 86400

proxy-groups:
  - name: AUTO
    type: url-test
    proxies: [REJECT]
    use: [Nodes]
    url: https://www.gstatic.com/generate_204
    interval: 600
  - name: 香港手动
    type: select
    proxies: [REJECT]
    use: [Nodes]
    filter: '(?i)(🇭🇰|香港|Hong[ -]?Kong|(^|[^A-Za-z])(HK|HKG)[0-9]*($|[^A-Za-z]))|^REJECT$'
  - name: 台湾手动
    type: select
    proxies: [REJECT]
    use: [Nodes]
    filter: '(?i)(🇹🇼|台湾|台灣|台北|Taiwan|(^|[^A-Za-z])(TW|TWN)[0-9]*($|[^A-Za-z]))|^REJECT$'
  - name: 日本手动
    type: select
    proxies: [REJECT]
    use: [Nodes]
    filter: '(?i)(🇯🇵|日本|东京|東京|大阪|Japan|Tokyo|Osaka|(^|[^A-Za-z])(JP|JPN)[0-9]*($|[^A-Za-z]))|^REJECT$'
  - name: 新加坡手动
    type: select
    proxies: [REJECT]
    use: [Nodes]
    filter: '(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|(^|[^A-Za-z])(SG|SGP)[0-9]*($|[^A-Za-z]))|^REJECT$'
  - name: 美国手动
    type: select
    proxies: [REJECT]
    use: [Nodes]
    filter: '(?i)(🇺🇸|美国|美國|洛杉矶|洛杉磯|纽约|紐約|西雅图|西雅圖|United[ -]?States|(^|[^A-Za-z])(US|USA)[0-9]*($|[^A-Za-z]))|^REJECT$'
  - name: PROXY
    type: select
    proxies: [AUTO, 香港手动, 台湾手动, 日本手动, 新加坡手动, 美国手动, REJECT]
  - name: AI
    type: select
    proxies: [PROXY, 香港手动, 台湾手动, 日本手动, 新加坡手动, 美国手动, DIRECT]
    use: [Nodes]
  - name: YouTube
    type: select
    proxies: [PROXY, 香港手动, 台湾手动, 日本手动, 新加坡手动, 美国手动, DIRECT]
    use: [Nodes]
  - name: Netflix
